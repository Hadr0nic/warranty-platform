<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f9f9f9;
  }

  h1, h3 {
    color: #2c3e50;
  }

  .form-group {
    margin-bottom: 15px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
  }

  input[type="text"], 
  textarea, 
  select {
    width: 100%;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  textarea {
    min-height: 80px;
  }

  .submit-btn {
    background-color: #3498db;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .submit-btn:hover {
    background-color: #2980b9;
  }

  .optional {
    font-weight: normal;
    color: #888;
  }

  .required {
    color: red;
  }

  a {
    color: #3498db;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .messages {
    padding: 10px;
    background-color: #fde3e3;
    border: 1px solid #f5c6cb;
    border-radius: 4px;
    margin-bottom: 15px;
  }
</style>


<h1>Reset Password</h1>
{% if messages %}
<ul>
  {% for message in messages %}
    <li>{{ message }}</li>
  {% endfor %}
</ul>
{% endif %}

<form method="post">
  {% csrf_token %}
  <input type="password" name="password" placeholder="New password" required>
  <input type="password" name="confirm_password" placeholder="Confirm password" required>
  <button type="submit">Reset Password</button>
</form>
